name: Backend CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install
        working-directory: ./cleansl-admin/backend

      - name: Run simple test
        run: echo "Backend pipeline running successfully"
        working-directory: ./backend
